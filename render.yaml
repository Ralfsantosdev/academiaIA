services:
  - type: web
    name: academia-ia-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://academia-ia-frontend.onrender.com
      - key: API_BASE_URL
        value: https://academiaia-1lfk.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: academia-ia-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_API_URL
        sync: false

  - type: web
    name: academia-ia-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://academiaia-1lfk.onrender.com

databases:
  - name: academia-ia-db
    databaseName: academia
    plan: free
    postgresMajorVersion: 16
